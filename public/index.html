<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau des Tâches Familiales - Dynamique</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header class="main-header">
            <h1>📋 Tâches Familiales</h1>
            <p>Gérez vos tâches quotidiennes en famille</p>
        </header>

        <!-- Filtres -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Tous</button>
            <button class="filter-btn" data-filter="papa">Papa</button>
            <button class="filter-btn" data-filter="maman">Maman</button>
            <button class="filter-btn" data-filter="bastien">Bastien</button>
            <button class="filter-btn" data-filter="florent">Florent</button>
        </div>

        <!-- Formulaire d'ajout de tâche -->
        <div class="add-task-section">
            <button id="toggleFormBtn" class="btn-primary">➕ Ajouter une tâche</button>
            
            <form id="taskForm" class="task-form hidden">
                <h3>Nouvelle Tâche</h3>
                
                <div class="form-group">
                    <label for="taskTitle">Titre de la tâche *</label>
                    <input type="text" id="taskTitle" required placeholder="Ex: Ranger sa chambre">
                </div>
                
                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" rows="3" placeholder="Détails de la tâche..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="assignedTo">Assignée à *</label>
                    <select id="assignedTo" required>
                        <option value="">Choisir une personne</option>
                        <option value="papa">Papa</option>
                        <option value="maman">Maman</option>
                        <option value="bastien">Bastien</option>
                        <option value="florent">Florent</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="priority">Priorité</label>
                    <select id="priority">
                        <option value="basse">Basse</option>
                        <option value="moyenne" selected>Moyenne</option>
                        <option value="haute">Haute</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="category">Catégorie</label>
                    <select id="category">
                        <option value="quotidien">Quotidien</option>
                        <option value="hebdomadaire">Hebdomadaire</option>
                        <option value="mensuel">Mensuel</option>
                    </select>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Enregistrer</button>
                    <button type="button" id="cancelFormBtn" class="btn-secondary">Annuler</button>
                </div>
            </form>
        </div>

        <!-- Sections par personne -->
        <div class="persons-container">
            <div class="person-section papa" data-person="papa">
                <div class="person-header">
                    <div class="person-name">👨 Papa</div>
                    <div class="stats">
                        <span class="completed-count">0</span>/<span class="total-count">0</span>
                    </div>
                </div>
                <div class="tasks-list" id="tasks-papa"></div>
            </div>

            <div class="person-section maman" data-person="maman">
                <div class="person-header">
                    <div class="person-name">👩 Maman</div>
                    <div class="stats">
                        <span class="completed-count">0</span>/<span class="total-count">0</span>
                    </div>
                </div>
                <div class="tasks-list" id="tasks-maman"></div>
            </div>

            <div class="person-section bastien" data-person="bastien">
                <div class="person-header">
                    <div class="person-name">👦 Bastien</div>
                    <div class="stats">
                        <span class="completed-count">0</span>/<span class="total-count">0</span>
                    </div>
                </div>
                <div class="tasks-list" id="tasks-bastien"></div>
            </div>

            <div class="person-section florent" data-person="florent">
                <div class="person-header">
                    <div class="person-name">🧒 Florent</div>
                    <div class="stats">
                        <span class="completed-count">0</span>/<span class="total-count">0</span>
                    </div>
                </div>
                <div class="tasks-list" id="tasks-florent"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        // TODO: Remplacer avec votre configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBIggEt3Mv_L5E_1OpsuHIuuvAXCYcKzAw",
            authDomain: "activity-day-to-day.firebaseapp.com",
            projectId: "activity-day-to-day",
            storageBucket: "activity-day-to-day.firebasestorage.app",
            messagingSenderId: "44469659985",
            appId: "1:44469659985:web:778b21561999f67a5a8b70"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Rendre db accessible globalement
        window.db = db;
    </script>
    
    <script type="module" src="js/app.js"></script>
</body>
</html>
