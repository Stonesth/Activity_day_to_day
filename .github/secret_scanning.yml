# Configuration GitHub Secret Scanning
# Cette configuration indique à GitHub que certains fichiers contiennent
# des "secrets" qui sont en réalité publics par design (clés Firebase client)

# Note: Cette fonctionnalité nécessite GitHub Advanced Security
# Pour les dépôts publics, c'est gratuit
# Pour les dépôts privés, c'est une fonctionnalité payante

# Chemins à ignorer pour le secret scanning
paths-ignore:
  - 'public/index.html'  # Firebase client config - safe to expose per Firebase docs
  - 'dont_commit/firestore.json'  # Already gitignored, but extra safety
